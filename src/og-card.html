<html><head><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:Inter,sans-serif;color:#fff;background:#0b1020;position:relative}
.bg{position:absolute;inset:0;background:
 radial-gradient(ellipse 55% 70% at 5% 0%,rgba(59,91,253,.38),transparent 70%),
 radial-gradient(ellipse 50% 65% at 100% 10%,rgba(124,58,237,.3),transparent 70%),
 radial-gradient(ellipse 60% 45% at 60% 115%,rgba(56,189,248,.12),transparent 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:56px 56px;
 -webkit-mask-image:radial-gradient(ellipse 80% 80% at 40% 40%,#000 20%,transparent 85%)}
.wrap{position:relative;padding:72px 80px;height:100%;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:16px;font-size:34px;font-weight:800;letter-spacing:-.03em}
.mark{width:56px;height:56px;border-radius:15px;background:linear-gradient(135deg,#3b5bfd,#7c3aed);display:grid;place-items:center;font-size:32px}
h1{margin-top:auto;font-size:68px;line-height:1.05;font-weight:800;letter-spacing:-.035em;max-width:900px}
.g{background:linear-gradient(90deg,#818cf8,#c084fc 55%,#60a5fa);-webkit-background-clip:text;color:transparent}
.row{display:flex;gap:12px;margin-top:40px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:10px;padding:10px 18px 10px 10px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);font-size:21px;font-weight:600}
.d{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:16px;font-weight:800}
.url{position:absolute;right:80px;top:84px;font-size:22px;font-weight:500;color:rgba(255,255,255,.6)}
</style></head><body><div class="bg"></div><div class="grid"></div>
<div class="url">xdosdev.com</div>
<div class="wrap">
 <div class="logo"><div class="mark">X</div>XdosDev</div>
 <h1>Software that runs <span class="g">businesses, schools and universities.</span></h1>
 <div class="row">
  <div class="chip"><span class="d" style="background:#1d4ed8">J</span>JADICOQ ERP</div>
  <div class="chip"><span class="d" style="background:#047857">S</span>StudyMate Schools</div>
  <div class="chip"><span class="d" style="background:#1f4d3a">U</span>Studymate UMS</div>
  <div class="chip"><span class="d" style="background:#d97706">L</span>LearnBee</div>
 </div>
</div></body></html>
